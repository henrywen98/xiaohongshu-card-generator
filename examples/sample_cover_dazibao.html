<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  /* 本地字体（相对路径，相对本示例文件 examples/ 定位到 ../assets/fonts/）。
     生成实际卡片时改用 assets/fonts.css 里的 file://{SKILL_ROOT}/... 绝对路径。 */
  @font-face { font-family:"Noto Sans SC"; font-weight:500; font-display:swap;
    src:url("../assets/fonts/NotoSansSC-500.woff2") format("woff2"); }
  @font-face { font-family:"Noto Sans SC"; font-weight:700; font-display:swap;
    src:url("../assets/fonts/NotoSansSC-700.woff2") format("woff2"); }
  /* 彩色 emoji —— 同样本地嵌入，避免在缺 emoji 字体的环境渲染成方块 □ */
  @font-face { font-family:"Noto Color Emoji"; font-weight:400; font-display:swap;
    src:url("../assets/fonts/NotoColorEmoji.woff2") format("woff2"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1440px;
    overflow: hidden;
    font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Color Emoji", sans-serif;
    /* 大字报：高对比亮底，不留冷淡大白边 */
    background:
      radial-gradient(900px 600px at 88% -8%, #FFE39A 0%, transparent 60%),
      #FFF3D6;
    color: #1A1A1A;
    font-weight: 500;
  }
  .container {
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 84px 80px 76px;
    position: relative;
  }
  /* 角标便利贴（轻微歪斜 + 硬投影，贴纸感） */
  .badge {
    align-self: flex-start;
    font-size: 34px;
    font-weight: 700;
    color: #1A1A1A;
    background: #FFFFFF;
    padding: 14px 26px;
    border-radius: 10px;
    box-shadow: 6px 8px 0 rgba(0,0,0,.12);
    transform: rotate(-2.5deg);
    margin-bottom: 64px;
  }
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 48px;
  }
  /* 大字报主标题：超粗 + 描边增重 */
  .title {
    font-size: 118px;
    font-weight: 700;
    line-height: 1.12;
    letter-spacing: -2px;
    color: #1A1A1A;
    -webkit-text-stroke: 1.2px #1A1A1A;
  }
  .title .pop { color: #FF3B30; -webkit-text-stroke-color: #FF3B30; }
  /* 马克笔高亮：只盖下半截 + 轻微歪，像荧光笔扫过 */
  .hl {
    background: linear-gradient(transparent 56%, rgba(255,229,77,.9) 56%);
    padding: 0 6px;
    display: inline-block;
    transform: rotate(-1.5deg);
  }
  .subtitle {
    font-size: 42px;
    font-weight: 500;
    line-height: 1.55;
    color: #3A2A12;
  }
  .checklist { list-style: none; display: flex; flex-direction: column; gap: 18px; }
  .checklist li { font-size: 44px; font-weight: 700; color: #1A1A1A; }
  .checklist li.no { color: #8A6A3A; font-weight: 500; }
  .bottom {
    display: flex;
    align-items: center;
    gap: 16px;
    padding-top: 12px;
  }
  .swipe {
    font-size: 38px;
    font-weight: 700;
    color: #FF3B30;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="badge">程序员必存🔖</div>
    <div class="main">
      <div class="title">救命谁懂啊😭<br>国产模型<span class="hl">也能跑</span><br><span class="pop">Claude&nbsp;Code</span></div>
      <div class="subtitle">不用魔法、不用信用卡 💳<br>配好这一套，终端直接开跑 🉑</div>
      <ul class="checklist">
        <li>✅ 国产模型直接接入</li>
        <li>✅ 全程 5 分钟搞定</li>
        <li class="no">❌ 不折腾、不踩坑</li>
      </ul>
    </div>
    <div class="bottom">
      <span class="swipe">👉 左滑有保姆级教程</span>
    </div>
  </div>
</body>
</html>
